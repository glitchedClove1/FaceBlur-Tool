# Single source of truth for hyperparameters and paths.
# Extended in later phases (data, anchors, model, training) — never hardcode
# values that live here inside the code.

project:
  name: face-detector
  seed: 42

env:
  device: cuda        # "cuda" or "cpu"; train.py/inference.py fall back to cpu with a warning if cuda is unavailable
  amp: true            # automatic mixed precision (only used when device == cuda)
  cudnn_benchmark: true

data:
  root: data/widerface
  image_size: 384        # square input resolution; 384 recommended for 4GB VRAM (see scripts/check_env.py)
  min_face_size: 4.0      # px in the *original* image; boxes smaller than this are dropped (tiny faces become
                           # sub-pixel after resize to image_size and just add label noise at this resolution)
  drop_invalid: true      # drop boxes the WIDER FACE annotators flagged "invalid"
  drop_empty_images: false  # keep images with zero remaining faces after filtering as background/hard-negative samples

augmentation:
  horizontal_flip:
    enabled: true
    prob: 0.5
  random_crop:            # the "zoom" augmentation: crops a random region (bbox-safe) then resizes to image_size,
    enabled: true          # which is what lets the network see small faces at a larger effective scale
    prob: 0.5
    erosion_rate: 0.2      # how much a crop is allowed to shrink retained boxes' visible area
  color_jitter:
    enabled: true
    prob: 0.5
    brightness: 0.4
    contrast: 0.4
    saturation: 0.3
    hue: 0.1
  blur:
    enabled: true
    prob: 0.1
    blur_limit: 5
  noise:
    enabled: true
    prob: 0.1
  normalize:
    # ImageNet statistics — used only as a fixed, well-tested normalization constant, not as a source of
    # pretrained weights (the model itself is still initialized randomly). Applied in the pipeline's native
    # BGR channel order (cv2.imread's default, never converted to RGB) rather than the RGB order these are
    # usually quoted in — inconsequential for a from-scratch model (R and B stats are close enough), just
    # note it here so it isn't mistaken for a bug later.
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  backbone:
    # Channel width at each stage. 5 stride-2 stages total (stem + 4), so
    # stage_channels[1:] are exposed as C3/C4/C5 at strides 8/16/32 - kept
    # narrow throughout since this runs on a 4GB GPU with no ImageNet init
    # to lean on.
    stem_channels: 16
    stage_channels: [32, 64, 128, 256]   # stage1(stride4, internal only), C3(stride8), C4(stride16), C5(stride32)
  neck:
    fpn_channels: 128   # unified channel width for P3/P4/P5 after lateral 1x1 convs
  head:
    num_convs: 2         # shared conv tower depth before the cls/reg output convs
    channels: 128

anchors:
  strides: [8, 16, 32]
  # Two square-anchor scales per level (aspect ratio fixed at 1:1 - faces
  # are near-square, so regression alone handles the rest). Sizes are in
  # pixels at the network's input resolution (data.image_size) and follow
  # RetinaFace's WIDER FACE anchor config, which was tuned specifically for
  # this dataset's face-scale distribution.
  min_sizes: [[16, 32], [64, 128], [256, 512]]
  variances: [0.1, 0.2]   # encode/decode scaling for center-offset and log-size terms, SSD-style
  pos_iou_threshold: 0.5   # anchor is positive if max IoU with any GT >= this...
  neg_iou_threshold: 0.4   # ...negative if max IoU < this (anchors in between are ignored in the loss)

training:
  # batch_size chosen empirically (scripts/check_env.py's recommendation was
  # for a generic architecture; this from-scratch model is much cheaper).
  # Measured peak VRAM at batch_size=96/384px: ~2.0GB of 4.3GB (47%) with
  # AMP - leaves comfortable headroom for the real loss (this measurement
  # used a dummy loss) and other processes sharing the GPU.
  batch_size: 96
  # 0, deliberately, not a generic default: this machine has only 7.4GB RAM,
  # and Windows' spawn-based multiprocessing means each DataLoader worker
  # re-imports the full torch/torchvision/cv2/albumentations stack from
  # scratch (no copy-on-write like Linux fork). Empirically, num_workers=1,
  # 2, and 4 all eventually crashed a worker process (RuntimeError:
  # DataLoader worker exited unexpectedly) after enough steps; num_workers=0
  # was the only setting that survived a full epoch, including the dataset's
  # single most extreme image (1827 faces). Training is CPU-augmentation-
  # bound as a result (measured ~4x slower than pure GPU compute time) - on
  # a machine with more RAM, raising this is worth retrying.
  num_workers: 0
  epochs: 90
  optimizer: adamw       # "adamw" or "sgd"
  lr: 0.0005
  weight_decay: 0.0001
  sgd_momentum: 0.9       # only used when optimizer == sgd
  warmup_epochs: 2
  lr_schedule: cosine      # "cosine" or "step"
  step_lr_milestones: [40, 50]   # only used when lr_schedule == step
  step_lr_gamma: 0.1
  grad_clip_norm: 5.0
  checkpoint_dir: checkpoints
  log_dir: runs
  log_every_n_steps: 20
  overfit:
    # --overfit-one-batch sanity gate: train on a single fixed batch until
    # loss is near zero and predicted boxes visibly lock onto the GT faces.
    # Must pass before any real training run - it's the one check that
    # proves data -> anchors -> model -> loss -> decode -> draw are all
    # wired correctly together.
    batch_size: 8   # deliberately small (independent of training.batch_size) so the model can fully memorize it
    steps: 400
    lr: 0.001
    conf_thresh: 0.3
    nms_thresh: 0.4

inference:
  conf_thresh: 0.5
  nms_thresh: 0.4
  max_detections: 200

loss:
  # Sigmoid focal loss (RetinaNet) rather than hard-negative mining: it
  # down-weights easy negatives smoothly across *all* anchors instead of
  # discarding most of them via a fixed neg:pos sampling ratio, which
  # throws away information and is sensitive to how "hard" negatives get
  # picked. alpha/gamma are the standard values from the focal loss paper.
  focal_alpha: 0.25
  focal_gamma: 2.0
  bbox_loss_weight: 1.0   # multiplier on the localization term relative to classification
